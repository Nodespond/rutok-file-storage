
services:
  minio:
    image: 'minio/minio:latest'
    container_name: minio
    environment:
      - MINIO_ROOT_USER=rutok
      - MINIO_ROOT_PASSWORD=rutokminio
    command: server ~/data --console-address :9001
    ports:
      - 9001:9001
      - 9000:9000

  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      - POSTGRES_USER=rutok
      - POSTGRES_PASSWORD=rutok
      - POSTGRES_DB=rutok
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: rutok-files:latest
    container_name: file-storage
    ports:
      - "8001:8001"
    environment:
      MINIO_HOST: "minio:9000"
      MINIO_ACCESS_KEY: "rutok"
      MINIO_SECRET_KEY: "rutokminio"
    depends_on:
      - minio
    restart: always
    volumes:
      - .:/app

volumes:
  postgres_data: