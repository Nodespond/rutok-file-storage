
services:
  minio:
    image: 'minio/minio:latest'
    container_name: minio
    environment:
      - MINIO_ROOT_USER=rutok
      - MINIO_ROOT_PASSWORD=rutokminio
    command: server ~/data --console-address :9001
    ports:
      - 9001:9001
      - 9000:9000

  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      - POSTGRES_USER=rutok
      - POSTGRES_PASSWORD=rutok
      - POSTGRES_DB=rutok
    ports:
      - 5432:5432

  file-storage:
    image: rutok-file-storage
    container_name: file-storage
    ports:
      - "8001:8001"
    environment:
      MINIO_HOST: "minio:9000"
      MINIO_ACCESS_KEY: "rutok"
      MINIO_SECRET_KEY: "rutokminio"
      FAST_API_PORT: "8001"
    depends_on:
      - minio
    volumes:
      - .:/app


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=rutok@rutok.com
      - PGADMIN_DEFAULT_PASSWORD=rutokminio
    ports:
      - "8080:80"
    depends_on:
      - postgres-db


